<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assam Education Hub Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font:16px Arial;background:#f3f6fb;color:#172033;display:grid;place-items:center;min-height:100vh;margin:0;padding:16px;box-sizing:border-box}.card{background:white;padding:24px;border-radius:16px;width:min(100%,440px);box-shadow:0 8px 32px #0001}h1{color:#173b72}label{display:block;margin:12px 0 5px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;font:inherit}input{border:1px solid #ccd5e1}button{border:0;background:#173b72;color:white;font-weight:bold;margin-top:14px}nav{display:flex;gap:6px}nav button{background:#e8eef8;color:#173b72}#msg{white-space:pre-wrap;background:#eef4ff;padding:10px;margin-top:12px}.hide{display:none!important}a{display:block;text-align:center;margin-top:18px}</style></head><body><main class="card"><h1>Assam Education Hub</h1><p>Sign in, or create an account using an invitation code.</p><nav><button type="button" id="loginTab">Login</button><button type="button" id="signupTab">Register</button><button type="button" id="forgotTab">Forgot password</button></nav><form id="form"><div id="nameWrap" class="hide"><label>Name</label><input id="name" maxlength="80"></div><label>Email</label><input id="email" type="email" required autocomplete="email"><div id="pwWrap"><label>Password (at least 8 characters)</label><input id="password" type="password" minlength="8" autocomplete="current-password"></div><div id="inviteWrap" class="hide"><label>Invitation code</label><input id="invite" autocomplete="off"></div><button id="submit" type="submit">Login</button></form><div id="msg" class="hide"></div><section id="dash" class="hide"><h2>Signed in</h2><p id="identity"></p><button id="makeInvite" type="button">Create invitation code</button><pre id="code"></pre><button id="logout" type="button">Logout</button></section><a href="index.html">Back to the website</a></main><script>
(()=>{const sb=window.supabase.createClient('https://fglkzwexpuihghhyuboz.supabase.co','sb_publishable_h4N-qILBpPnhkocTczCSNA_HzZeV69o');const $=x=>document.getElementById(x);let mode='login';function msg(t){$('msg').textContent=t;$('msg').classList.remove('hide')}function setMode(m){mode=m;$('msg').classList.add('hide');$('nameWrap').classList.toggle('hide',m!=='signup');$('inviteWrap').classList.toggle('hide',m!=='signup');$('pwWrap').classList.toggle('hide',m==='forgot');$('password').required=m!=='forgot';$('submit').textContent={login:'Login',signup:'Create account',forgot:'Send recovery email',update:'Update password'}[m]}$('loginTab').onclick=()=>setMode('login');$('signupTab').onclick=()=>setMode('signup');$('forgotTab').onclick=()=>setMode('forgot');async function refresh(){let {data:{session}}=await sb.auth.getSession();$('dash').classList.toggle('hide',!session);$('form').classList.toggle('hide',!!session);$('loginTab').classList.toggle('hide',!!session);$('signupTab').classList.toggle('hide',!!session);$('forgotTab').classList.toggle('hide',!!session);if(session)$('identity').textContent=session.user.email} $('form').onsubmit=async e=>{e.preventDefault();try{let email=$('email').value.trim(),password=$('password').value,r;if(mode==='login'){r=await sb.auth.signInWithPassword({email,password})}else if(mode==='signup'){let data={display_name:$('name').value.trim()};if($('invite').value.trim())data.invite_code=$('invite').value.trim();r=await sb.auth.signUp({email,password,options:{data,emailRedirectTo:location.origin+location.pathname}});if(!r.error)msg('Check your email to confirm registration. The first account is the founder; later registrations require an invitation code.')}else if(mode==='forgot'){r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname+'?reset=1'});if(!r.error)msg('If the account exists, a recovery email has been sent.')}else{r=await sb.auth.updateUser({password});if(!r.error){msg('Password updated.');setMode('login')}}if(r?.error)throw r.error;await refresh()}catch(e){msg(e.message||'Request failed')}};$('makeInvite').onclick=async()=>{try{let {data,error}=await sb.rpc('create_invitation',{p_uses_allowed:1,p_days_valid:7});if(error)throw error;$('code').textContent='Invitation code (one use, expires in 7 days): '+data}catch(e){msg(e.message)}};$('logout').onclick=async()=>{await sb.auth.signOut();await refresh()};sb.auth.onAuthStateChange(e=>{if(e==='PASSWORD_RECOVERY'){setMode('update');msg('Enter your new password and tap Update password.')}});if(new URLSearchParams(location.search).get('reset')==='1')setMode('update');refresh()})();
</script></body></html>
